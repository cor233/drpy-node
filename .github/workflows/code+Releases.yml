name: sync（code+Releases）

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: 检出目标仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置Git用户信息
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加上游仓库
        run: git remote add upstream https://github.com/zourjke/drpy-node.git

      - name: 拉取上游更新
        run: git fetch upstream main

      - name: 合并上游更新
        run: git merge upstream/main --allow-unrelated-histories --no-edit

      - name: 推送更新
        run: git push origin main

  sync-releases:
    runs-on: ubuntu-latest
    needs: sync-code
    steps:
      - name: 获取源仓库所有 Releases
        run: |
          SOURCE_REPO="zourjke/drpy-node"
          PAGE=1
          PER_PAGE=100
          RELEASES_JSON=""

          while true; do
            API_URL="https://api.github.com/repos/${SOURCE_REPO}/releases?per_page=${PER_PAGE}&page=${PAGE}"
            RESPONSE=$(curl -s "$API_URL")

            if ! echo "$RESPONSE" | jq -e 'type == "array"' > /dev/null 2>&1; then
              echo "错误：API 响应不是数组，退出。"
              echo "响应内容：$RESPONSE"
              exit 1
            fi

            if [ "$(echo "$RESPONSE" | jq length)" -eq 0 ]; then
              break
            fi

            if [ -z "$RELEASES_JSON" ]; then
              RELEASES_JSON="$RESPONSE"
            else
              RELEASES_JSON=$(echo "$RELEASES_JSON" "$RESPONSE" | jq -s 'add')
            fi

            PAGE=$((PAGE + 1))
            sleep 0.5
          done

          RELEASES_JSON=$(echo "$RELEASES_JSON" | jq 'sort_by(.published_at)')
          echo "$RELEASES_JSON" > releases.json

      - name: 按顺序处理每个 Release
        run: |
          TARGET_REPO="${{ github.repository }}"

          jq -c '.[]' releases.json | while IFS= read -r release; do
            TAG_NAME=$(echo "$release" | jq -r '.tag_name')
            TITLE=$(echo "$release" | jq -r '.name // .tag_name')
            BODY=$(echo "$release" | jq -r '.body // ""')
            IS_PRERELEASE=$(echo "$release" | jq -r '.prerelease')
            IS_DRAFT=$(echo "$release" | jq -r '.draft')

            echo "=============================="
            echo "处理 Release: $TAG_NAME"

            if gh release view "$TAG_NAME" --repo "$TARGET_REPO" &>/dev/null; then
              echo "已存在，跳过。"
              continue
            fi

            CREATE_CMD="gh release create \"$TAG_NAME\" --repo \"$TARGET_REPO\" --title \"$TITLE\""
            if [ -n "$BODY" ]; then
              echo "$BODY" > body.txt
              CREATE_CMD="$CREATE_CMD --notes-file body.txt"
            fi
            if [ "$IS_PRERELEASE" = "true" ]; then
              CREATE_CMD="$CREATE_CMD --prerelease"
            fi
            if [ "$IS_DRAFT" = "true" ]; then
              CREATE_CMD="$CREATE_CMD --draft"
            fi

            if ! eval "$CREATE_CMD"; then
              echo "❌ 创建 Release $TAG_NAME 失败，退出。"
              exit 1
            fi

            ASSET_URLS=$(echo "$release" | jq -r '.assets[]?.browser_download_url')
            if [ -n "$ASSET_URLS" ]; then
              TEMP_DIR=$(mktemp -d)
              cd "$TEMP_DIR"
              echo "$ASSET_URLS" | while IFS= read -r url; do
                if [ -n "$url" ]; then
                  echo "  ⬇️ 下载: $url"
                  if curl -f -s -L -O "$url"; then
                    echo "    下载成功"
                  else
                    echo "    下载失败"
                  fi
                fi
              done
              for file in *; do
                if [ -f "$file" ]; then
                  echo "  ⬆️ 上传: $file"
                  gh release upload "$TAG_NAME" "$file" --repo "$TARGET_REPO" --clobber
                fi
              done
              cd ..
              rm -rf "$TEMP_DIR"
            fi
            rm -f body.txt
          done
